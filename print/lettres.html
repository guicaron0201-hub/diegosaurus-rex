<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Lettres à cacher — Diegosaurus Rex</title>
<!-- Les 6 lettres de la chasse au mot secret (ÉCLORE), une par page A5, fond blanc.
     PDF déjà généré : print/lettres-A5.pdf (sinon Imprimer > A5 depuis Chrome, marges : aucune) -->
<style>
@page{size:A5 portrait;margin:0}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{margin:0;padding:0;background:#fff}
.page{
  width:148mm;height:210mm;margin:0 auto;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8mm 0 7mm;
  page-break-after:always;break-after:page
}
.page:last-child{page-break-after:auto;break-after:auto}
@media screen{ body{background:#777} .page{background:#fff;margin:10mm auto} }
.tape{
  width:124mm;height:4mm;border-radius:1mm;
  background:repeating-linear-gradient(45deg,#E8A33D 0 5mm,#1a1a17 5mm 10mm)
}
.bas{display:flex;flex-direction:column;align-items:center;gap:4mm}
.marque{
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
  font-size:4mm;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:#8f6412
}
.lettre{
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
  font-size:140mm;line-height:1;font-weight:900;
  color:#E8A33D;                     /* ambre de la charte */
  text-shadow:0 3mm 0 #8f6412
}
</style>
</head>
<body>
<script>
  // une page A5 par lettre du mot secret
  document.write(["É","C","L","O","R","E"].map(l => '<section class="page"><div class="tape"></div><div class="lettre">' + l + '</div>' +
    '<div class="bas"><div class="marque">🦕 Diegosaurus Rex</div><div class="tape"></div></div></section>').join(""));
</script>
</body>
</html>
